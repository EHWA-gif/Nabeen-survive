<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survivor - Web Game v1.4.1 Fast Attack</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b12;font-family:Arial,"Malgun Gothic",sans-serif;color:#fff}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:min(100vw,960px);height:min(100vh,640px);overflow:hidden;background:#111827}
canvas{display:block;width:100%;height:100%;background:#101827}
#hud{position:absolute;left:0;top:0;width:100%;padding:14px 18px;pointer-events:none;text-shadow:0 2px 3px #000}
.row{display:flex;align-items:center;gap:14px}
#levelText{font-weight:bold;min-width:70px}
.bar{height:16px;background:#293244;border:2px solid #111827;border-radius:10px;overflow:hidden}
#xpBar{width:260px}.fill{height:100%;width:0%;transition:width .1s}
#xpFill{background:#49d7ff}
#hpBar{width:180px}#hpFill{background:#ef476f}
#stats{margin-top:7px;font-size:14px;opacity:.95}
#centerMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:10}
.panel{position:relative;z-index:11;background:rgba(8,12,22,.88);border:1px solid #42506b;border-radius:16px;padding:28px 34px;text-align:center;box-shadow:0 15px 50px #0009}
.panel h1{margin:0 0 10px;font-size:38px}.panel p{margin:8px 0;color:#c7d0df}
button{position:relative;z-index:12;pointer-events:auto;border:0;border-radius:10px;padding:12px 22px;font-size:16px;font-weight:bold;background:#58d5ff;color:#071019;cursor:pointer;margin-top:15px}
button:hover{filter:brightness(1.1)}
#upgrade{position:absolute;inset:0;background:#0008;display:none;align-items:center;justify-content:center}
.cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:800px}
.card{width:220px;min-height:145px;background:#172033;border:1px solid #465779;border-radius:14px;padding:18px;text-align:left;cursor:pointer}
.card:hover{transform:translateY(-3px);border-color:#72dcff;background:#1b2940}
.card h3{margin:0 0 8px;font-size:18px}.card p{margin:0;color:#c4ccda;font-size:14px;line-height:1.45}
#message{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);background:#000b;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none}
</style>
</head>
<body>
<div id="game">
<canvas id="canvas"></canvas>
<div id="hud">
  <div class="row">
    <div id="levelText">Lv. 1</div>
    <div class="bar" id="xpBar"><div class="fill" id="xpFill"></div></div>
    <div class="bar" id="hpBar"><div class="fill" id="hpFill"></div></div>
  </div>
  <div id="stats">처치 0 · 생존 0:00 · 무기 1</div>
</div>
<div id="centerMsg">
  <div class="panel">
    <h1>⚔️ Survivor <small style="font-size:14px;color:#8fa3c7">v1.4.1</small></h1>
    <p>WASD 또는 방향키로 이동하세요.</p><p style="color:#8fa3c7">캐릭터가 직접 움직이고, 화면은 가장자리에서 따라옵니다.<br>레벨업할 때 새로운 무기를 획득하거나 강화할 수 있습니다.</p>
    <p>공격은 자동으로 이루어집니다.</p><p style="color:#ff8fa3">⚠️ 적은 느리고 적지만, 부딪히면 큰 피해를 입습니다.</p>
    <button id="startBtn">게임 시작</button>
  </div>
</div>
<div id="upgrade">
  <div class="panel">
    <h1>✨ 레벨 업!</h1>
    <p>하나를 선택하세요.</p>
    <div class="cards" id="cards"></div>
  </div>
</div>
<div id="message"></div>
</div>

const canvas=document.getElementById("canvas"), ctx=canvas.getContext("2d");
const gameEl=document.getElementById("game");
let W=960,H=640, running=false, paused=false, last=0, elapsed=0;
let cameraX=0, cameraY=0;
const keys={};
let player, enemies=[], bullets=[], gems=[], particles=[];
let kills=0, level=1, xp=0, xpNeed=8, weaponLevel=1, spawnTimer=0, shootTimer=0, hitCooldown=0;
let upgrades=[];
let weapons=[];
let lightningFlash=0;

function resize(){
  const r=gameEl.getBoundingClientRect();
  const d=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.floor(r.width*d); canvas.height=Math.floor(r.height*d);
  W=r.width; H=r.height; ctx.setTransform(d,0,0,d,0,0);
}
addEventListener("resize",resize); resize();

addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase())) e.preventDefault();
  if((e.key.toLowerCase()==="r")&&!running) startGame();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function startGame(){
  running=true; paused=false; elapsed=0;kills=0;level=1;xp=0;xpNeed=8;weaponLevel=1;
  enemies=[];bullets=[];gems=[];particles=[];
  weapons=[{type:"magic",level:1,cooldown:0},{type:"shotgun",level:0,cooldown:0},{type:"fireball",level:0,cooldown:0},{type:"lightning",level:0,cooldown:0},{type:"orbit",level:0,cooldown:0}];
  lightningFlash=0;
  player={
    x:0,y:0,r:18,speed:220,maxHp:30,hp:30,
    damage:5,fireRate:.15,bulletSpeed:470,range:520,multi:1
  };
  cameraX=player.x-W/2;
  cameraY=player.y-H/2;
  document.getElementById("centerMsg").style.display="none";
  document.getElementById("upgrade").style.display="none";
  last=performance.now(); requestAnimationFrame(loop);
  showMessage("생존을 시작하세요!");
}

function spawnEnemy(){
  const angle=Math.random()*Math.PI*2;
  const minDist=Math.max(W,H)*0.62;
  const maxDist=Math.max(W,H)*0.82;
  const dist=minDist+Math.random()*(maxDist-minDist);
  const x=player.x+Math.cos(angle)*dist;
  const y=player.y+Math.sin(angle)*dist;
  const t=Math.random();
  let e;
  if(t<.10+Math.min(elapsed/2400,.16)){
    e={x,y,r:18,hp:60+level*5,maxHp:60+level*5,speed:50+level*1.0,damage:900,elite:true};
  }else{
    e={x,y,r:11+Math.random()*4,hp:30+level*2,maxHp:30+level*2,speed:45+level*1.2,damage:600,elite:false};
  }
  enemies.push(e);
}

function nearestEnemies(count, range){
  return enemies.filter(e=>(e.x-player.x)**2+(e.y-player.y)**2<=range*range)
    .sort((a,b)=>((a.x-player.x)**2+(a.y-player.y)**2)-((b.x-player.x)**2+(b.y-player.y)**2)).slice(0,count);
}
function addBullet(angle, damage, speed, r, life, kind="normal", splash=0){
  bullets.push({x:player.x+Math.cos(angle)*20,y:player.y+Math.sin(angle)*20,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,r,damage,life,kind,splash});
}
function shootWeapon(w){
  const lv=w.level;
  if(lv<=0)return;
  if(w.type==="magic"){
    const targets=nearestEnemies(1,player.range); if(!targets.length)return;
    const base=Math.atan2(targets[0].y-player.y,targets[0].x-player.x);
    const n=player.multi+Math.floor((lv-1)/3);
    for(let i=0;i<n;i++) addBullet(base+(i-(n-1)/2)*.16,player.damage+lv*3,player.bulletSpeed,5,1.5);
    w.cooldown=Math.max(.18,player.fireRate);
  }else if(w.type==="shotgun"){
    const targets=nearestEnemies(1,player.range+100); if(!targets.length)return;
    const base=Math.atan2(targets[0].y-player.y,targets[0].x-player.x);
    const n=4+lv;
    for(let i=0;i<n;i++) addBullet(base+(i-(n-1)/2)*.18,20+lv*4,430,4,1.1,"shotgun");
    w.cooldown=Math.max(.65,1.35-lv*.08);
  }else if(w.type==="fireball"){
    const targets=nearestEnemies(1,player.range+160); if(!targets.length)return;
    const base=Math.atan2(targets[0].y-player.y,targets[0].x-player.x);
    const n=Math.min(3,1+Math.floor(lv/3));
    for(let i=0;i<n;i++) addBullet(base+(i-(n-1)/2)*.12,30+lv*8,400,10,2.0,"fireball",55+lv*8);
    w.cooldown=Math.max(.7,1.8-lv*.1);
  }else if(w.type==="lightning"){
    const targets=nearestEnemies(1+Math.floor(lv/2),player.range+80); if(!targets.length)return;
    for(const e of targets){
      e.hp-=35+lv*15;
      lightningFlash=.12;
      for(let i=0;i<10;i++)particles.push({x:e.x,y:e.y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.4});
      if(e.hp<=0){kills++;gems.push({x:e.x,y:e.y,r:e.elite?7:5,value:e.elite?4:1}); enemies.splice(enemies.indexOf(e),1);}
    }
    w.cooldown=Math.max(.7,1.7-lv*.12);
  }else if(w.type==="orbit"){
    w.cooldown=.12;
  }
}
function shoot(dt){
  for(const w of weapons){
    if(w.level<=0) continue;

    w.cooldown -= dt;

    if(w.cooldown<=0){
      shootWeapon(w);
    }
  }
}
function addXp(v){
  xp+=v;
  while(xp>=xpNeed){
    xp-=xpNeed; level++; xpNeed=Math.floor(xpNeed*1.32+3);
    paused=true; showUpgrade();
  }
}

function showUpgrade(){
  const magic=weapons.find(w=>w.type==="magic");
  const shotgun=weapons.find(w=>w.type==="shotgun");
  const fireball=weapons.find(w=>w.type==="fireball");
  const lightning=weapons.find(w=>w.type==="lightning");
  const orbit=weapons.find(w=>w.type==="orbit");
  const pool=[
    {title:"🔥 공격력 강화",desc:"기본 공격력 +10",apply:()=>player.damage+=10},
    {title:"⚡ 기본 무기 강화",desc:`마탄 Lv.${magic.level+1} (공격력 증가)`,apply:()=>magic.level++},
    {title:"💨 이동속도",desc:"이동속도 +30",apply:()=>player.speed+=30},
    {title:"❤️ 최대 체력",desc:"최대 HP +25 및 회복",apply:()=>{player.maxHp+=25;player.hp=Math.min(player.maxHp,player.hp+25)}},
    {title:"🌀 투사체 증가",desc:"마탄 투사체 +1",apply:()=>player.multi+=1},
    {title:"🎯 사거리 증가",desc:"공격 사거리 +100",apply:()=>player.range+=100},
    ...(shotgun.level===0?[{title:"🔫 산탄총 획득",desc:"전방에 여러 발을 부채꼴로 발사",apply:()=>shotgun.level=1}]:[{title:"🔫 산탄총 강화",desc:`산탄총 Lv.${shotgun.level+1} · 탄환 증가`,apply:()=>shotgun.level++}]),
    ...(fireball.level===0?[{title:"☄️ 화염구 획득",desc:"강력한 화염구가 적중 시 주변도 공격",apply:()=>fireball.level=1}]:[{title:"☄️ 화염구 강화",desc:`화염구 Lv.${fireball.level+1} · 폭발 범위 증가`,apply:()=>fireball.level++}]),
    ...(lightning.level===0?[{title:"⚡ 번개 획득",desc:"가까운 적에게 즉발 번개 공격",apply:()=>lightning.level=1}]:[{title:"⚡ 번개 강화",desc:`번개 Lv.${lightning.level+1} · 연쇄 대상 증가`,apply:()=>lightning.level++}]),
    ...(orbit.level===0?[{title:"🗡️ 회전검 획득",desc:"주변을 회전하며 적에게 피해",apply:()=>orbit.level=1}]:[{title:"🗡️ 회전검 강화",desc:`회전검 Lv.${orbit.level+1} · 검 증가`,apply:()=>orbit.level++}])
  ];
  upgrades=[...pool].sort(()=>Math.random()-.5).slice(0,3);
  const box=document.getElementById("cards"); box.innerHTML="";
  upgrades.forEach(u=>{
    const c=document.createElement("div");c.className="card";
    c.innerHTML=`<h3>${u.title}</h3><p>${u.desc}</p>`;
    c.onclick=()=>{u.apply();weaponLevel=weapons.filter(w=>w.level>0).length;document.getElementById("upgrade").style.display="none";paused=false;last=performance.now();showMessage("강화 완료!");};
    box.appendChild(c);
  });
  document.getElementById("upgrade").style.display="flex";
}

function hurtPlayer(d){
  if(hitCooldown>0)return;
  player.hp-=d;hitCooldown=.55;
  for(let i=0;i<7;i++)particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,life:.35});
  if(player.hp<=0)gameOver();
}

function gameOver(){
  running=false;paused=false;
  document.getElementById("centerMsg").style.display="flex";
  document.getElementById("centerMsg").innerHTML=`<div class="panel"><h1>💀 게임 오버</h1><p>생존 시간 <b>${formatTime(elapsed)}</b></p><p>처치 <b>${kills}</b> · 레벨 <b>${level}</b></p><button onclick="startGame()">다시 시작</button></div>`;
}

function formatTime(s){
  s=Math.floor(s);return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
}

function showMessage(t){
  const m=document.getElementById("message");m.textContent=t;m.style.opacity=1;
  clearTimeout(showMessage.timer);showMessage.timer=setTimeout(()=>m.style.opacity=0,1300);
}

function update(dt){
  elapsed+=dt; hitCooldown=Math.max(0,hitCooldown-dt);

  // 플레이어는 실제 월드 좌표에서 이동한다.
  let dx=(keys["d"]||keys["arrowright"]?1:0)-(keys["a"]||keys["arrowleft"]?1:0);
  let dy=(keys["s"]||keys["arrowdown"]?1:0)-(keys["w"]||keys["arrowup"]?1:0);
  if(dx||dy){
    const l=Math.hypot(dx,dy);
    dx/=l; dy/=l;
    player.x+=dx*player.speed*dt;
    player.y+=dy*player.speed*dt;
  }

  // 카메라는 플레이어가 화면 가장자리에 가까워질 때만 따라온다.
  // 따라서 플레이어가 이동하는 모습이 화면에 직접 보인다.
  const marginX=W*0.28, marginY=H*0.28;
  const sx=player.x-cameraX, sy=player.y-cameraY;
  if(sx<marginX) cameraX=player.x-marginX;
  if(sx>W-marginX) cameraX=player.x-(W-marginX);
  if(sy<marginY) cameraY=player.y-marginY;
  if(sy>H-marginY) cameraY=player.y-(H-marginY);

  spawnTimer-=dt;
  const interval=Math.max(.42,1.15-elapsed/120);
  if(spawnTimer<=0){
    spawnTimer=interval;
    const count=elapsed<30?1:elapsed<90?2:elapsed<180?3:4;
    for(let i=0;i<count && enemies.length<140;i++)spawnEnemy();
  }

  shoot(dt);

  for(const e of enemies){
    const a=Math.atan2(player.y-e.y,player.x-e.x);
    e.x+=Math.cos(a)*e.speed*dt;
    e.y+=Math.sin(a)*e.speed*dt;
    if(Math.hypot(player.x-e.x,player.y-e.y)<player.r+e.r) hurtPlayer(e.damage*dt);
  }

  const orbitWeapon=weapons.find(w=>w.type==="orbit");
  if(orbitWeapon && orbitWeapon.level>0){
    const bladeCount=1+Math.floor((orbitWeapon.level-1)/2);
    const orbitR=48+orbitWeapon.level*5;
    const spin=elapsed*2.6;
    for(let k=0;k<bladeCount;k++){
      const a=spin+k*Math.PI*2/bladeCount;
      const ox=player.x+Math.cos(a)*orbitR, oy=player.y+Math.sin(a)*orbitR;
      for(let j=enemies.length-1;j>=0;j--){
        const e=enemies[j];
        if(Math.hypot(ox-e.x,oy-e.y)<e.r+9){
          if(!e.orbitHit||elapsed-e.orbitHit>.28){e.hp-=18+orbitWeapon.level*8;e.orbitHit=elapsed;
            if(e.hp<=0){kills++;gems.push({x:e.x,y:e.y,r:e.elite?7:5,value:e.elite?4:1});enemies.splice(j,1);}
          }
        }
      }
    }
  }
  lightningFlash=Math.max(0,lightningFlash-dt);

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    let remove=b.life<=0 ||
      Math.hypot(b.x-player.x,b.y-player.y)>player.range+180;
    for(let j=enemies.length-1;j>=0&&!remove;j--){
      const e=enemies[j];
      if(Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){
        e.hp-=b.damage;remove=true;
        for(let k=0;k<6;k++)particles.push({x:b.x,y:b.y,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,life:.3});
        if(b.splash>0){
          for(const other of enemies){
            if(other!==e && Math.hypot(other.x-b.x,other.y-b.y)<b.splash) other.hp-=b.damage*.55;
          }
          for(let k=0;k<18;k++)particles.push({x:b.x,y:b.y,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,life:.55});
        }
        if(e.hp<=0){kills++;gems.push({x:e.x,y:e.y,r:e.elite?7:5,value:e.elite?4:1});enemies.splice(j,1);}
      }
    }
    if(remove)bullets.splice(i,1);
  }

  for(let i=gems.length-1;i>=0;i--){
    const g=gems[i],d=Math.hypot(player.x-g.x,player.y-g.y);
    if(d<105){
      const a=Math.atan2(player.y-g.y,player.x-g.x);
      g.x+=Math.cos(a)*260*dt;
      g.y+=Math.sin(a)*260*dt;
    }
    if(d<player.r+g.r+5){addXp(g.value);gems.splice(i,1);}
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }

  // 화면 밖으로 너무 멀리 떨어진 적/보석/파티클 정리
  const cleanup=1300;
  enemies=enemies.filter(e=>Math.abs(e.x-player.x)<cleanup&&Math.abs(e.y-player.y)<cleanup);
  gems=gems.filter(g=>Math.abs(g.x-player.x)<cleanup&&Math.abs(g.y-player.y)<cleanup);

  document.getElementById("levelText").textContent=`Lv. ${level}`;
  document.getElementById("xpFill").style.width=(xp/xpNeed*100)+"%";
  document.getElementById("hpFill").style.width=(Math.max(0,player.hp/player.maxHp)*100)+"%";
  document.getElementById("stats").textContent=
    `처치 ${kills} · 생존 ${formatTime(elapsed)} · 무기 ${weapons.filter(w=>w.level>0).length} · 적 ${enemies.length}`;
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // 월드 좌표를 화면 좌표로 변환
  const sx=x=>x-cameraX;
  const sy=y=>y-cameraY;

  // 이동하는 월드 그리드
  ctx.strokeStyle="#1c293c";ctx.lineWidth=1;
  const size=48;
  let ox=(((-cameraX)%size)+size)%size;
  let oy=(((-cameraY)%size)+size)%size;
  for(let x=ox;x<W;x+=size){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  for(let y=oy;y<H;y+=size){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }

  for(const g of gems){
    const x=sx(g.x),y=sy(g.y);
    if(x<-20||x>W+20||y<-20||y>H+20)continue;
    ctx.beginPath();
    ctx.moveTo(x,y-g.r);ctx.lineTo(x+g.r,y);
    ctx.lineTo(x,y+g.r);ctx.lineTo(x-g.r,y);
    ctx.closePath();ctx.fillStyle="#4de3ff";ctx.fill();
  }

  for(const b of bullets){
    const x=sx(b.x),y=sy(b.y);
    if(x<-30||x>W+30||y<-30||y>H+30)continue;
    ctx.beginPath();ctx.arc(x,y,b.r,0,Math.PI*2);
    ctx.fillStyle="#ffe66d";ctx.fill();
    ctx.beginPath();ctx.arc(x,y,b.r*2.2,0,Math.PI*2);
    ctx.fillStyle="#ffe66d22";ctx.fill();
  }

  for(const e of enemies){
    const x=sx(e.x),y=sy(e.y);
    if(x<-50||x>W+50||y<-50||y>H+50)continue;
    ctx.beginPath();ctx.arc(x,y,e.r,0,Math.PI*2);
    ctx.fillStyle=e.elite?"#a855f7":"#ef476f";ctx.fill();
    if(e.elite){
      ctx.strokeStyle="#e9d5ff";ctx.lineWidth=2;ctx.stroke();
    }
    const bw=e.r*2.2;
    ctx.fillStyle="#111827";ctx.fillRect(x-bw/2,y-e.r-8,bw,4);
    ctx.fillStyle="#67e8a5";
    ctx.fillRect(x-bw/2,y-e.r-8,bw*Math.max(0,e.hp/e.maxHp),4);
  }

  for(const p of particles){
    const x=sx(p.x),y=sy(p.y);
    if(x<-20||x>W+20||y<-20||y>H+20)continue;
    ctx.globalAlpha=Math.max(0,p.life/.35);
    ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fillStyle="#fff";ctx.fill();ctx.globalAlpha=1;
  }

  const orbitWeapon=weapons.find(w=>w.type==="orbit");
  if(orbitWeapon && orbitWeapon.level>0){
    const bladeCount=1+Math.floor((orbitWeapon.level-1)/2), orbitR=48+orbitWeapon.level*5, spin=elapsed*2.6;
    for(let k=0;k<bladeCount;k++){
      const a=spin+k*Math.PI*2/bladeCount, x=sx(player.x+Math.cos(a)*orbitR), y=sy(player.y+Math.sin(a)*orbitR);
      ctx.save();ctx.translate(x,y);ctx.rotate(a+.8);ctx.fillStyle="#e5e7eb";ctx.fillRect(-4,-16,8,32);ctx.restore();
    }
  }
  if(lightningFlash>0){ctx.fillStyle=`rgba(220,245,255,${lightningFlash*1.8})`;ctx.fillRect(0,0,W,H);}

  if(player){
    const x=sx(player.x),y=sy(player.y);
    ctx.save();
    ctx.globalAlpha=hitCooldown>0
      ? 0.72+Math.sin(performance.now()/45)*0.18 : 1;
    ctx.shadowColor="#38bdf8";ctx.shadowBlur=12;
    const size=58;
    ctx.drawImage(playerImage,x-size/2,y-size/2,size,size);
    ctx.restore();
  }
}

function loop(now){
  if(!running)return;
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(!paused)update(dt);
  draw();
  requestAnimationFrame(loop);
}
document.getElementById("startBtn").onclick=startGame;
</script>
</body>
</html>
